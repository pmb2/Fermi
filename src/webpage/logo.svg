<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 135.5 135.5">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="135.5" y2="135.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6C3CE1"/>
      <stop offset="45%" stop-color="#5A2FC8"/>
      <stop offset="100%" stop-color="#00D4AA"/>
    </linearGradient>
    <linearGradient id="bLetterGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6C3CE1"/>
      <stop offset="100%" stop-color="#00D4AA"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D4C9F5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00000033"/>
    </filter>
  </defs>

  <!-- Outer circle background with gradient -->
  <circle cx="67.75" cy="67.75" r="67.75" fill="url(#bgGrad)"/>

  <!-- Subtle inner ring for depth -->
  <circle cx="67.75" cy="67.75" r="64" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Inner semi-transparent circle -->
  <circle cx="67.75" cy="67.75" r="54" fill="rgba(255,255,255,0.07)"/>

  <!-- Chat bubble (main body) -->
  <rect x="34" y="33" rx="15" ry="15" width="67.5" height="50" fill="#FFFFFF" filter="url(#shadow)"/>
  <path d="M 57 83 L 67 71 L 77 83 Z" fill="#FFFFFF" filter="url(#shadow)"/>

  <!-- Left Wing (Hermes messenger wing - 3 feather curves) -->
  <g filter="url(#glow)">
    <path d="M 38 54 
             C 24 50, 14 40, 10 30 
             C 8 24, 14 22, 18 26 
             C 22 30, 26 36, 30 40 
             C 26 28, 24 18, 26 12 
             C 28 6, 34 8, 34 16 
             C 34 24, 34 34, 32 44 
             C 38 38, 44 34, 50 36 
             C 55 38, 50 44, 44 50 Z" 
          fill="url(#wingGrad)"/>
  </g>

  <!-- Right Wing (mirrored) -->
  <g filter="url(#glow)">
    <path d="M 97.5 54 
             C 111.5 50, 121.5 40, 125.5 30 
             C 127.5 24, 121.5 22, 117.5 26 
             C 113.5 30, 109.5 36, 105.5 40 
             C 109.5 28, 111.5 18, 109.5 12 
             C 107.5 6, 101.5 8, 101.5 16 
             C 101.5 24, 101.5 34, 103.5 44 
             C 97.5 38, 91.5 34, 85.5 36 
             C 80.5 38, 85.5 44, 91.5 50 Z" 
          fill="url(#wingGrad)"/>
  </g>

  <!-- Stylized "B" letterform in the bubble -->
  <g transform="translate(67.75, 60)">
    <!-- B vertical stem + curves -->
    <path d="M -10 -16 L -10 16 
             C -10 16, -6 16, 0 16 
             C 8 16, 8 8, 4 8 
             L -2 8 
             L -2 0 
             L 2 0 
             C 10 0, 10 -8, 4 -8 
             L -2 -8 
             L -2 -16 Z" 
          fill="none" stroke="url(#bLetterGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
